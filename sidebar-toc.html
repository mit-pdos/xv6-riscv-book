<!-- Chapter section list inside the left sidebar.
     Included via _quarto.yml's `include-after-body`. The book sets `toc: false`
     so Quarto emits no right-hand margin TOC (that space belongs to the code
     pop-out in coderef-panel.html). Instead we build the current chapter's
     section list here and nest it under the chapter's own sidebar entry. -->
<script>
(function () {
  function build() {
    var active = document.querySelector("#quarto-sidebar .sidebar-link.active");
    if (!active) return;
    var item = active.closest("li.sidebar-item");
    if (!item) return;

    var secs = document.querySelectorAll("main#quarto-document-content section.level2[id]");
    if (!secs.length) return;

    var list = document.createElement("ul");
    list.className = "list-unstyled chapter-sections";
    var links = [];
    secs.forEach(function (sec) {
      var h = sec.querySelector("h2");
      if (!h) return;
      var li = document.createElement("li");
      li.className = "chapter-section";
      var a = document.createElement("a");
      a.className = "sidebar-item-text sidebar-link chapter-section-link";
      a.href = "#" + sec.id;
      // The heading already renders its own section number, so take it as-is.
      a.textContent = h.textContent.replace(/\s+/g, " ").trim();
      li.appendChild(a);
      list.appendChild(li);
      links.push({ a: a, sec: sec });
    });
    item.appendChild(list);

    // Highlight the section the reader is currently in; Quarto's own scrollspy
    // only ran against the margin TOC, which no longer exists.
    var current = null;
    function sync() {
      var found = links[0];
      for (var i = 0; i < links.length; i++) {
        if (links[i].sec.getBoundingClientRect().top <= 120) found = links[i];
      }
      if (found === current) return;
      if (current) current.a.classList.remove("active");
      if (found) found.a.classList.add("active");
      current = found;
    }
    var queued = false;
    window.addEventListener("scroll", function () {
      if (queued) return;
      queued = true;
      requestAnimationFrame(function () { queued = false; sync(); });
    }, { passive: true });
    sync();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", build);
  } else {
    build();
  }
})();
</script>
